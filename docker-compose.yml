# ═══════════════════════════════════════════════════════════════════════════════
# SentinelChain — Docker Compose
# One-command startup: docker compose up --build
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelchain}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelchain_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelchain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sentinelchain}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sentinelchain_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Anvil (Local Ethereum chain) ───────────────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelchain}:${POSTGRES_PASSWORD:-sentinelchain_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelchain}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      ANCHOR_CHAIN_RPC_URL: http://anvil:8545
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      anvil:
        condition: service_started
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:create_app --host 0.0.0.0 --port 8000 --reload --factory
      "

  # ─── Detection Worker ──────────────────────────────────────────────────────
  detection-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelchain}:${POSTGRES_PASSWORD:-sentinelchain_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelchain}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      ANCHOR_CHAIN_RPC_URL: http://anvil:8545
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.detection_worker

  # ─── Response Worker ────────────────────────────────────────────────────────
  response-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelchain}:${POSTGRES_PASSWORD:-sentinelchain_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelchain}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      ANCHOR_CHAIN_RPC_URL: http://anvil:8545
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.response_worker

  # ─── Anchor Worker ─────────────────────────────────────────────────────────
  anchor-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelchain}:${POSTGRES_PASSWORD:-sentinelchain_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelchain}
      REDIS_URL: redis://redis:6379/0
      ANCHOR_CHAIN_RPC_URL: http://anvil:8545
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.anchor_worker

  # ─── Action Expiry Worker ──────────────────────────────────────────────────
  action-expiry-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelchain}:${POSTGRES_PASSWORD:-sentinelchain_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelchain}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.action_expiry_worker

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_WS_URL: ws://backend:8000
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redis_data:
  minio_data:
