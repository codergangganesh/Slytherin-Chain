id: DATA-EXFILTRATION-PLAYBOOK
applies_to_category: data_exfiltration
autonomy_mode_required: auto
conditions:
  min_risk_score: 65
  min_confidence: 0.75
actions:
  - action_type: block_ip
    target: incident.primary_src_ip
    ttl_seconds: 7200
  - action_type: restrict_access
    target: incident.primary_username
    ttl_seconds: 3600
  - action_type: notify
    target: webhook
