id: RANSOMWARE-PLAYBOOK
applies_to_category: ransomware
autonomy_mode_required: auto
conditions:
  min_risk_score: 80
  min_confidence: 0.85
actions:
  - action_type: isolate_host
    target: incident.primary_host
    ttl_seconds: 14400
    requires_approval_if:
      asset_criticality_at_least: 4
      is_protected_asset: true
  - action_type: disable_user
    target: incident.primary_username
    ttl_seconds: 7200
    requires_approval_if:
      is_protected_asset: true
  - action_type: notify
    target: webhook
