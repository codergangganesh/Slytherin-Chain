id: BRUTE-FORCE-PLAYBOOK
applies_to_category: brute_force
autonomy_mode_required: auto
conditions:
  min_risk_score: 60
  min_confidence: 0.7
actions:
  - action_type: block_ip
    target: incident.primary_src_ip
    ttl_seconds: 3600
    requires_approval_if:
      asset_criticality_at_least: 5
  - action_type: notify
    target: webhook
