[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelchain-backend"
version = "0.1.0"
description = "SentinelChain — Autonomous Response & Incident Management Platform"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "web3>=7.6.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0",
    "weasyprint>=63.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.6",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.21.0",
    "types-PyYAML>=6.0.0",
    "types-python-jose>=3.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "storage",
    "test_all_endpoints.py",
    "test_login_flow.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # bugbear
]
ignore = [
    "B008",   # FastAPI Depends() in function parameters
    "RUF012", # Mutable class attributes
    "E501",   # Line too long
    "E402",   # Module level import not at top of file
    "W291",   # Trailing whitespace
    "W293",   # Blank line whitespace
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "minio.*",
    "web3.*",
    "weasyprint.*",
    "asyncpg.*",
    "argon2.*",
    "jose.*",
    "urllib3.*",
    "structlog.*",
    "simulator.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
